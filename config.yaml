    mid: 2008
    long: 2010
  last_dev_year: 2019
  stress_year: 2020
  holdout_years: [2024, 2025]
  top_k: 5
  min_cross_section: 8
  embargo_trading_days: 5
  bootstrap_draws: 2000
  transaction_cost_per_side_bps: 100
  random_baseline_draws: 200
  min_train_rows: 200
  market_calendar_min_series: 10
  stretched_horizon_ratio: 1.5

