project_name: "Stock Pulse"
random_seed: 42

universe_main_types: ["N"]
universe_selection: "most_rows_among_N_X"
min_valid_feature_rows_for_scoring: 750
include_nonvoting_series: false

horizons:
  short: 21
  mid: 63
  long: 252

cleaning:
  gap_days_threshold: 30
  bridge_max_gap_days: 60
  shared_gap_fraction: 0.8
  hard_break_gap_days: 60
  auto_adjust_splits: true
  split_detection:
    tolerance: 0.05
    common_ratios: [2.0, 3.0, 4.0, 5.0, 10.0]
  extreme_moves:
    threshold_20: 0.20
    threshold_50: 0.50

