version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: stockpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: stockpulse_secure_password_123
      POSTGRES_DB: stockpulse_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d stockpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockpulse_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: dev
      SECRET_KEY: production_grade_random_secret_key_minimum_32_characters_long
      DATABASE_URL: postgresql://stockpulse:stockpulse_secure_password_123@db:5432/stockpulse_db
      ADMIN_EMAIL: admin@stockpulse.lk
      ADMIN_PASSWORD: AdminSuperSecretPassword2026!
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8000
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 7
      MAX_UPLOAD_MB: 25
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data

volumes:
  postgres_data:
